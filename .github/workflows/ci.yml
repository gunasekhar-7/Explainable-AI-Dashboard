name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aletheia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        env:
          ALETHEIA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aletheia_test
        run: pytest -p no:warnings

      # The ML core is where a silent mistake becomes a wrong explanation, so it carries a coverage floor.
      - name: Coverage floor on the ML core
        run: >
          pytest tests/unit -p no:warnings
          --cov=aletheia.ml --cov=aletheia.core
          --cov-report=term-missing --cov-fail-under=85

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable --progress-spinner off

      - name: SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
