[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia"
version = "0.1.0"
description = "Explainable AI and model governance platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "structlog>=24.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "joblib>=1.4",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
local-explanations = ["lime>=0.2"]
fairness = ["fairlearn>=0.10"]
dashboard = ["streamlit>=1.36", "plotly>=5.22", "matplotlib>=3.8"]
reporting = ["reportlab>=4.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, hermetic tests",
    "integration: needs Postgres or the filesystem",
    "contracts: API contract tests against a running app",
    "e2e: full stack",
]

[tool.coverage.run]
source = ["aletheia"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "PTH"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "S101"]

[tool.mypy]
python_version = "3.11"
files = ["src/aletheia/core", "src/aletheia/ml"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_decorators = false
